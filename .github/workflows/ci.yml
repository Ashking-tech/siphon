name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg lame poppler-utils webp

      - name: Test
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee /tmp/go-test.log
          status=${PIPESTATUS[0]}
          if ((status != 0)); then
            msg=$(tail -n 80 /tmp/go-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=go test failure::$msg"
            exit "$status"
          fi

      - name: Vet
        run: go vet ./...

      - name: Test KDE wrapper
        shell: bash
        run: |
          set +e
          ./kde/test-wrapper.sh 2>&1 | tee /tmp/kde-test.log
          status=${PIPESTATUS[0]}
          if ((status != 0)); then
            msg=$(tail -n 80 /tmp/kde-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=KDE wrapper test failure::$msg"
            exit "$status"
          fi
