name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg lame poppler-utils webp

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test KDE wrapper
        run: ./kde/test-wrapper.sh
