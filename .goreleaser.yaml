version: 2

project_name: siphon

builds:
  - id: siphon
    main: ./cmd/siphon
    binary: siphon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X siphon/internal/version.Version={{ .Version }}
      - -X siphon/internal/version.Commit={{ .ShortCommit }}

archives:
  - id: siphon
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - kde/install.sh
      - kde/siphon-gui-kde
      - kde/servicemenus/*.desktop

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: Ashking-tech
    name: siphon
  draft: false
  prerelease: auto
